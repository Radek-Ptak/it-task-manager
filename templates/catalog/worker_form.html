{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <h1>{{ object|yesno:"Update,Create" }} worker</h1>
  <form action="" method="post" novalidate>
    {% csrf_token %}
    {{ form|crispy }}
    <div class="mt-3">
      <input type="submit" value="Submit" class="btn btn-primary">
      <a href="{% url 'catalog:worker-list' %}"
         class="btn btn-secondary">
        Cancel
      </a>
    </div>
  </form>
{% endblock %}
