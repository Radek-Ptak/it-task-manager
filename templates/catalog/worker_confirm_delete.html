{% extends "base.html" %}

{% block content %}
  <h1>Delete worker?</h1>
  <p>Are you sure you want to delete:
    <strong>{{ worker.get_full_name|default:worker.username }}</strong> ?
  </p>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes" class="btn btn-danger">
    <a href="{% url 'catalog:worker-detail' pk=worker.pk %}" class="btn btn-secondary">
      Cancel
    </a>
  </form>
{% endblock %}
